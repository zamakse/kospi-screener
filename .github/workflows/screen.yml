name: kospi-screener

on:
  schedule:
    - cron: "20 11 * * 1-5"   # 평일 20:20 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python screener.py
      - name: Commit results
        run: |
          git config user.name "kospi-screener"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "results: $(date -u +%F)"
          git push
